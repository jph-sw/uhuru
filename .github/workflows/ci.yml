name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, OpenAPI, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --filter '*' typecheck

      - name: OpenAPI spec is up to date
        run: |
          bun run openapi
          git diff --exit-code packages/openapi || {
            echo "::error::packages/openapi is out of date. Run 'bun run openapi' and commit the result."
            exit 1
          }

      - name: Build web
        run: bun run build

  contract:
    name: Contract tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every backend must pass the same contract tests. To add one, add it
        # here plus an `include` entry with its commands (and any setup step
        # it needs, e.g. actions/setup-dotnet guarded by matrix.backend).
        backend: [bun]
        include:
          - backend: bun
            workdir: apps/api
            migrate: bun --bun drizzle-kit migrate
            start: bun src/index.ts

    env:
      API_PORT: 3001
      BASE_URL: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-contract-tests-secret-with-32-plus-characters
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: admin@ci.test
      ADMIN_PASSWORD: ci-admin-password
      DATABASE_PATH: /tmp/uhuru-contract/database.sqlite

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Migrate database
        working-directory: ${{ matrix.workdir }}
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          ${{ matrix.migrate }}

      - name: Start ${{ matrix.backend }} backend
        working-directory: ${{ matrix.workdir }}
        run: |
          nohup ${{ matrix.start }} > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$BASE_URL/api/content/health-check" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Backend did not start"
          cat /tmp/backend.log
          exit 1

      - name: Run contract tests
        working-directory: tests/contract
        run: bun test --timeout 20000

      - name: Backend log
        if: always()
        run: cat /tmp/backend.log

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose -p uhuru-ci up -d --build --wait

      - name: Sign in through the web proxy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/auth/sign-in > /dev/null && break
            sleep 1
          done
          curl -sf -c cookies.txt -X POST http://localhost:3000/api/auth/sign-in/email \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"changeme"}'
          test "$(curl -s -b cookies.txt -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/)" = \
            "307 http://localhost:3000/admin"

      - name: Logs
        if: always()
        run: docker compose -p uhuru-ci logs

      - name: Stop
        if: always()
        run: docker compose -p uhuru-ci down -v
